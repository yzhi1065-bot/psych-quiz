version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: psych-quiz-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-psych123456}
      MYSQL_DATABASE: psych_quiz
      MYSQL_USER: quiz_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-psych123456}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  server:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.server
    container_name: psych-quiz-server
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://quiz_user:${DB_PASSWORD:-psych123456}@mysql:3306/psych_quiz"
      JWT_SECRET: ${JWT_SECRET:-psych-quiz-jwt-secret-prod-2026}
      JWT_EXPIRES_IN: 7d
      PORT: 3000
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: psych-quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../admin/dist:/usr/share/nginx/html/admin
      - ../client/dist:/usr/share/nginx/html
    depends_on:
      - server

volumes:
  mysql_data:
